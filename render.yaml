# This file defines the services for deploying the application to Render.
# To deploy, connect your repo to Render Blueprints.

# 1. APPLICATION SERVICES
services:
  # ------------------
  # Web Service (Your Node.js App)
  # ------------------
  - type: web
    name: app
    env: docker
    plan: free 
    # 🔴 IMPORTANT: Render automatically picks up the repo linked to the Blueprint, 
    # so 'repo' is usually not required unless pointing to a different one.
    
    healthCheckPath: /v1/health # Ensure this matches your actual route (e.g., /api/health or /v1/health)
    
    # 🟢 UPDATED COMMAND: Migration + Seeding + Start
    # We use "seed:prod" because we don't have ts-node in production
    startCommand: "npx prisma migrate deploy && npm run seed:prod && node dist/server.js"
    
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: db
          property: connectionString
      - key: REDIS_HOST
        fromService:
          type: redis
          name: redis
          property: host
      - key: REDIS_PORT
        fromService:
          type: redis
          name: redis
          property: port
      - key: JWT_SECRET
        generateValue: true
      - key: NODE_ENV
        value: production
        
  # ------------------
  # Redis Instance
  # ------------------
  # Redis is considered a "service" in Render Blueprints, not a "database"
  - type: redis
    name: redis
    plan: free # Note: Free Redis on Render is not persistent (data clears on restart)

# 2. DATABASES (Moved here!)
databases:
  # ------------------
  # PostgreSQL Database
  # ------------------
  - name: db
    plan: free 
    databaseName: myapp_db # Optional: specific DB name
    user: admin # Optional: specific user
    postgresMajorVersion: 16