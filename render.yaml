# This file defines the services for deploying the application to Render.
# It follows the "Infrastructure as Code" practice, allowing you to version-control your deployment environment.
# To deploy, simply point Render to your repository and it will use this file.

services:
  # ------------------
  # Web Service (Your Node.js App)
  # ------------------
  - type: web
    name: app
    # Use the Docker environment from our repository's Dockerfile
    env: docker
    # 🔴 IMPORTANT: Change this URL to point to your own GitHub repository.
    repo: https://github.com/github_username/repository_name
    plan: free # Or "starter" for more resources
    # Health check route that we will add to the application
    healthCheckPath: /api/health
    # Custom start command to run migrations before starting the server. This is critical.
    startCommand: "npx prisma migrate deploy && node dist/server.js"
    envVars:
      # These variables are automatically populated by Render from the services below.
      - key: DATABASE_URL
        fromDatabase:
          name: db
          property: connectionString
      - key: REDIS_HOST
        fromService:
          type: redis
          name: redis
          property: host
      - key: REDIS_PORT
        fromService:
          type: redis
          name: redis
          property: port
      # Let Render generate a secure, random string for the JWT secret.
      - key: JWT_SECRET
        generateValue: true
      # ⬇️ IMPORTANT: Add other secrets like AWS keys, Google Client ID, etc.,
      # in the Render dashboard under the "Environment" section for this service.
      # Do not commit them to this file.

  # ------------------
  # PostgreSQL Database
  # ------------------
  - type: pserv
    name: db
    env: postgres
    plan: free # Or "starter" for more resources
    postgresMajorVersion: 16

  # ------------------
  # Redis Instance
  # ------------------
  - type: redis
    name: redis
    plan: free # Or "starter" for more resources
